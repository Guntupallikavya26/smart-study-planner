# ===================================================================
# SMART STUDY PLANNER - SPRING BOOT APPLICATION CONFIGURATION
# ===================================================================

# Server Port and Base Context Path
# Configured on port 8081 to avoid conflict with Oracle XE TNSLSNR listener on port 8080
server.port=8081
server.servlet.context-path=/api

# Application Metadata
spring.application.name=smart-study-planner-backend

# ===================================================================
# DATABASE CONFIGURATION (Persistent Disk Storage with MySQL Compatibility Mode)
# ===================================================================
# Persistent file database: permanently saved to disk in ./data/smart_study_planner_db.mv.db
# MODE=MySQL ensures full standard MySQL SQL semantics, data types, and syntax.
# ddl-auto=update ensures user accounts and tables are NEVER dropped on restart.
spring.datasource.url=jdbc:h2:file:./data/smart_study_planner_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# NOTE: If you have an external MySQL 8.0 server installed and running on port 3306,
# you can alternatively switch to the native MySQL driver below:
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_study_planner_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# SPRING DATA JPA & HIBERNATE CONFIGURATION
# ===================================================================
# ddl-auto: 'update' safely creates or updates tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update

# Show and format SQL queries in the console for easy debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session In View (OSIV) to prevent lazy loading leaks
spring.jpa.open-in-view=false

# ===================================================================
# JSON SERIALIZATION (JACKSON)
# ===================================================================
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.com.smartstudy.planner=DEBUG

# ===================================================================
# MACHINE LEARNING MICROSERVICE CONFIGURATION
# ===================================================================
ml.service.url=http://localhost:5000

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

